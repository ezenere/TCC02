run_name: eixo2_prune_resnet50_p70_s1
seed: 1
data:
  manifest: data/processed/manifest_v2.csv
  root: null
  image_size: 224
  hflip: true
  batch_size: 96
  eval_batch_size: 192
  workers: 16
  prefetch_factor: 6
model:
  arch: resnet50
  pretrained: false
  init_from: runs/eixo1_resnet50_s1/checkpoints/best.pt
prune:
  sparsity: 0.7
  scope: global_magnitude
optim:
  name: sgd
  lr: 0.00375
  momentum: 0.9
  weight_decay: 0.0001
  nesterov: true
  label_smoothing: 0.0
sched:
  name: cosine
  warmup_epochs: 0
train:
  epochs: 5
  amp: fp16
  channels_last: true
  cudnn_benchmark: true
  early_stopping_patience: 0
paths:
  runs: runs
