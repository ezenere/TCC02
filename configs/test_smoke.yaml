# Config dos testes de fumaca (tests/test_train_smoke.py). Determinismo forcado.
run_name: "smoke_{arch}_s{seed}"
seed: 0
data:
  manifest: data/processed/manifest_v2.csv
  root: null
  image_size: 224
  hflip: true
  batch_size: 32
  eval_batch_size: 64
  workers: 4
  prefetch_factor: 2
model: {arch: resnet50, pretrained: true}
optim: {name: sgd, lr: 0.01, momentum: 0.9, weight_decay: 0.0001, nesterov: true, label_smoothing: 0.0}
sched: {name: cosine, warmup_epochs: 1}
train: {epochs: 2, amp: fp16, channels_last: true, cudnn_benchmark: false, early_stopping_patience: 0}
paths: {runs: runs/_smoke}
